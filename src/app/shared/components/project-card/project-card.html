<article class="overflow-hidden rounded-xl border border-[#EAE3E8] bg-white transition-shadow hover:shadow-lg">
    <div class="aspect-video overflow-hidden bg-[#F0E8ED]">
        @if (imageUrl()) {
            <img 
            [src]="imageUrl()"
            [alt]="title() + ' project screenshot'"
            class="h-full w-full object-cover">
        }
        @else{
            <div class="flex h-full items-center justify-center">
                <span class="text-sm text-[#6B6570]">Project Preview</span>
            </div>
        }
    </div>

    <div class="p-6">
        <h3 class="mb-3 text-xl font-bold text-[#252126]">
            {{ title() }}
        </h3>

        <p class="mb-5 text-sm leading-7 text-[#6B6570]">
            {{ description() }}
        </p>

        <span class="inline-block rounded-md bg-[#F0E8ED] px-3 py-1 text-xs font-semibold text-[#6B3F5B]">
            {{ technology() }}
        </span>

        <div class="mt-6 flex items-center gap-4">
            @if (githubUrl()) {
                <a 
                [href]="githubUrl()"
                target="_blank"
                rel="noopener noreferrer"
                class="text-sm font-semibold text-[#6B3F5B] hover:underline">
                Github
            </a>
        }

            @if (liveUrl()) {
                <a [href]="liveUrl()"
                target="_blank"
                rel="noopener noreferrer"
                class="text-sm font-semibold text-[#6B3F5B] hover:underline">
                Live Preview
            </a>
            }

        </div>
    </div>
</article>
