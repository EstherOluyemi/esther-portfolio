
<header class="w-full border-b border-[#EAE3E8] bg-white">
  <nav
    class="relative mx-auto flex max-w-7xl items-center justify-between px-6 py-5"
  >
    <!-- Logo -->
    <a
      routerLink="/"
      (click)="closeMenu()"
      class="text-xl font-bold text-[#6B3F5B]"
    >
      Esther.
    </a>

    <!-- Desktop Navigation -->
    <div class="hidden items-center gap-8 md:flex">
      <a routerLink="/" class="text-sm font-medium text-[#6B3F5B]">
        Home
      </a>

      <a
        routerLink="/about"
        class="text-sm text-gray-600 transition-colors hover:text-[#6B3F5B]"
      >
        About
      </a>

      <a
        routerLink="/projects"
        class="text-sm text-gray-600 transition-colors hover:text-[#6B3F5B]"
      >
        Projects
      </a>

      <a
        routerLink="/contact"
        class="text-sm text-gray-600 transition-colors hover:text-[#6B3F5B]"
      >
        Contact
      </a>
    </div>

    <!-- Desktop Theme Button -->
    <button
      type="button"
      class="hidden rounded-md border border-[#EAE3E8] px-4 py-2 text-sm text-[#6B3F5B] hover:bg-[#F1ECF7] md:block"
    >
      Theme
    </button>

    <!-- Mobile Menu Button -->
    <button
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen()"
      aria-label="Toggle navigation menu"
      class="rounded-md border border-[#EAE3E8] px-3 py-2 text-[#6B3F5B] md:hidden"
    >
      @if (isMenuOpen()) {
        <svg lucideX [size]="22"></svg>
      } @else {
        <svg lucideMenu [size]="22"></svg>
      }
    </button>

    <!-- Mobile Navigation -->
    @if (isMenuOpen()) {
      <div
        class="absolute left-0 top-full z-50 flex w-full flex-col gap-5 border-b border-[#EAE3E8] bg-white px-6 py-6 shadow-md md:hidden"
      >
        <a routerLink="/" (click)="closeMenu()" class="text-sm text-[#6B3F5B]">
          Home
        </a>

        <a
          routerLink="/about"
          (click)="closeMenu()"
          class="text-sm text-gray-600"
        >
          About
        </a>

        <a
          routerLink="/projects"
          (click)="closeMenu()"
          class="text-sm text-gray-600"
        >
          Projects
        </a>

        <a
          routerLink="/contact"
          (click)="closeMenu()"
          class="text-sm text-gray-600"
        >
          Contact
        </a>

        <button
          type="button"
          class="w-fit rounded-md border border-[#EAE3E8] px-4 py-2 text-sm text-[#6B3F5B]"
        >
          Theme
        </button>
      </div>
    }
  </nav>
</header>
