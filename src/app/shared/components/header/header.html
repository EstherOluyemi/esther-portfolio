<header class="sticky top-0 z-50 w-full border-b border-[#EAE3E8] bg-white">
  <nav class="relative mx-auto flex max-w-7xl items-center justify-between px-6 py-5">
    <!-- Logo -->
    <a routerLink="/" (click)="closeMenu()" class="text-xl font-bold text-[#6B3F5B]">
      Esther.
    </a>

    <!-- Desktop Navigation -->
    <div class="hidden items-center gap-8 md:flex">
      <a routerLink="/" class="text-sm font-medium text-[#6B3F5B]">
        Home
      </a>

      <a routerLink="/" fragment="about" class="text-sm text-gray-600 transition-colors hover:text-[#6B3F5B]">
        About
      </a>

      <a routerLink="/" fragment="projects" class="text-sm text-gray-600 transition-colors hover:text-[#6B3F5B]">
        Projects
      </a>

      <a routerLink="/" fragment="contact" class="text-sm text-gray-600 transition-colors hover:text-[#6B3F5B]">
        Contact
      </a>
    </div>

    <!-- Desktop Theme Button -->
    <button type="button" (click)="toggleTheme()" aria-label="Toggle colour theme"
      class="hidden rounded-full border border-[#EAE3E8] p-2 text-[#6B3F5B] transition-colors hover:bg-[#F1ECF7] md:block">
      @if (theme() === 'light') {
      <svg lucideMoon [size]="20"></svg>
      } @else {
      <svg lucideSun [size]="20"></svg>
      }
    </button>

    <!-- Mobile Menu Button -->
    <button type="button" (click)="toggleTheme()" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen()"
      aria-label="Toggle navigation menu" class="rounded-md border border-[#EAE3E8] px-3 py-2 text-[#6B3F5B] md:hidden">
      @if (isMenuOpen()) {
      <svg lucideX [size]="22"></svg>
      } @else {
      <svg lucideMenu [size]="22"></svg>
      }
    </button>

    <!-- Mobile Navigation -->
    @if (isMenuOpen()) {
    <div
      class="absolute left-0 top-full z-50 flex w-full flex-col gap-5 border-b border-[#EAE3E8] bg-white px-6 py-6 shadow-md md:hidden">
      <a routerLink="/" (click)="closeMenu()" class="text-sm text-[#6B3F5B]">
        Home
      </a>

      <a routerLink="/" fragment="about" (click)="closeMenu()" class="text-sm text-gray-600">
        About
      </a>

      <a routerLink="/" fragment="projects" (click)="closeMenu()" class="text-sm text-gray-600">
        Projects
      </a>

      <a routerLink="/" fragment="contact" (click)="closeMenu()" class="text-sm text-gray-600">
        Contact
      </a>

      <!-- Mobile Theme Toggle -->
      <button type="button" (click)="toggleTheme()" aria-label="Toggle colour theme"
        class="w-fit rounded-full border border-[#EAE3E8] p-2 text-[#6B3F5B] transition-colors hover:bg-[#F1ECF7]">
        @if (theme() === 'light') {
        <svg lucideMoon [size]="20"></svg>
        } @else {
        <svg lucideSun [size]="20"></svg>
        }
      </button>
    </div>
    }
  </nav>
</header>
