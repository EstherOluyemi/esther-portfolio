<section class="bg-[#FAF7F5] px-6 py-20 md:py-28">
    <div class="mx-auto max-w-7x">
        <div class="max-w-3xl">
            <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-[#6B3F5B]">
                My Work
            </p>

            <h1 class="mb-6 text-4xl font-boldn text-[#252126] md: text-5xl">
                Projects I've worked on.
            </h1>

            <p class="text-base leading-8 text-[#6B6570] md:text-lg">
                A collection of projects where I've explored ideas, developed
                solutions, and strengthened my frontend development skills.
            </p>
        </div>
    </div>
</section>

<section class="bg-white px-6 py-20 md:py-24">
    <div class="mx-auto max-w-7xl">
        <div class="grid grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-3">
            @for (project of projects; track project.id) {
            <app-project-card [title]="project.title" [description]="project.description"
                [technology]="project.technology" [githubUrl]="project.githubUrl" [liveUrl]="project.liveUrl"
                [imageUrl]="project.imageUrl" />
            }
        </div>
    </div>
</section>
